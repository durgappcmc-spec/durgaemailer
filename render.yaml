services:
  - type: web
    name: durgaemailer-relay
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: APP_REQUIRE_LOGIN
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: TRACKING_BASE_URL
        value: https://durgaemailer-tracking.netlify.app
      - key: AUTO_SYNC_GMAIL
        value: "true"
      - key: AUTO_INGEST_PROSPECTS
        value: "true"
      - key: AUTO_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: AUTO_SYNC_GMAIL_DAYS
        value: "30"
      - key: AUTO_SYNC_MAX_PER
        value: "75"
      - key: GMAIL_FROM_EMAIL
        value: csr@karunamedia.org
      - key: GMAIL_DEFAULT_CC
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: APPS_SCRIPT_TRACKING_URL
        sync: false
      - key: GMAIL_TOKEN_JSON
        sync: false
      - key: GMAIL_OAUTH_JSON
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ZOOMINFO_USERNAME
        sync: false
      - key: ZOOMINFO_PASSWORD
        sync: false
      - key: ZOOMINFO_API_KEY
        sync: false
      - key: ZOOMINFO_CLIENT_ID
        sync: false
